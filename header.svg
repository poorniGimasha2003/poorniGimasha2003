.edge{stroke:#2a3a5c;stroke-width:1.2}
.pulse{stroke-width:2;stroke-linecap:round;fill:none;stroke-dasharray:8 400;animation:fire 2.8s linear infinite}
@keyframes fire{from{stroke-dashoffset:8}to{stroke-dashoffset:-400}}
.node{fill:#0d1117;stroke-width:2}
.core{animation:beat 2.8s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}
.t1{font:700 42px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.t2{font:500 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff}
.t3{font:400 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7b8}
.lab{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif}
.fade{animation:in 1.2s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>

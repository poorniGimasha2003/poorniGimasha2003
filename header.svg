<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#7ee7ff" stop-opacity=".9"/><stop offset="1" stop-color="#7ee7ff" stop-opacity="0"/></radialGradient>

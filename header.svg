<style>
.edge{stroke:#2a3a5c;stroke-width:1.2}
.pruned{stroke:#3a2a3a;stroke-width:1;stroke-dasharray:3 4}
.pulse{stroke:#7ee7ff;stroke-width:2;stroke-linecap:round;fill:none;stroke-dasharray:8 400;animation:fire 2.6s linear infinite}
@keyframes fire{from{stroke-dashoffset:8}to{stroke-dashoffset:-400}}
.node{fill:#0d1117;stroke:#7ee7ff;stroke-width:2}
.core{fill:#7ee7ff;animation:beat 2.6s ease-in-out infinite}
@keyframes beat{0%,100%{opacity:.35}50%{opacity:1}}
.dead{fill:none;stroke:#6e4a6e;stroke-width:1.5;stroke-dasharray:3 3}
.t1{font:700 40px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.t2{font:400 17px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff}
.t3{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b949e}
.lab{font:400 11px 'Consolas',monospace;fill:#6e7a96}
</style>

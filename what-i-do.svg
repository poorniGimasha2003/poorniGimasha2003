<svg xmlns="http://www.w3.org/2000/svg" width="900" height="170" viewBox="0 0 900 170"><style>
.h{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.p{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7b8}
.s{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff;letter-spacing:.5px}
.chip{font:500 11px Consolas,'Courier New',monospace;fill:#c9d1d9}
.tt{font:700 16px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}.e{font:30px 'Segoe UI',Helvetica,Arial,sans-serif}.tile{animation:in .8s ease-out both}@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}</style>
<g class="tile" style="animation-delay:0.00s">

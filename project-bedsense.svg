<svg xmlns="http://www.w3.org/2000/svg" width="290" height="262" viewBox="0 0 290 262"><style>
.h{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.p{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7b8}
.s{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff;letter-spacing:.5px}
.chip{font:500 11px Consolas,'Courier New',monospace;fill:#c9d1d9}
.e{font:26px 'Segoe UI',Helvetica,Arial,sans-serif}.go{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee787}.ar{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/></linearGradient></defs>
<rect width="290" height="262" rx="14" fill="url(#bg)" stroke="#263046"/>
<rect x="0" y="0" width="6" height="262" rx="3" fill="#7ee787"/>
<text class="e" x="26" y="50">🛏️</text><text class="h" x="64" y="47" style="font-size:19px">BedSense</text>
<text class="s" x="26" y="78" style="fill:#7ee787;font-size:11px">HEALTHCARE IOT · AWARD WINNER</text>
<text class="p" x="26" y="106" style="font-size:13px">Smart mattress that monitors</text>
<text class="p" x="26" y="126" style="font-size:13px">bedridden patients in real time</text>
<text class="p" x="26" y="146" style="font-size:13px">and alerts caregivers before</text>
<text class="p" x="26" y="166" style="font-size:13px">bedsores develop.</text>
<rect x="26" y="190" width="53" height="24" rx="12" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".4"/><text class="chip" x="35" y="206">ESP32</text>
<rect x="87" y="190" width="46" height="24" rx="12" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".4"/><text class="chip" x="96" y="206">MQTT</text>
<rect x="141" y="190" width="53" height="24" rx="12" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".4"/><text class="chip" x="150" y="206">React</text>
<rect x="202" y="190" width="46" height="24" rx="12" fill="#7ee787" fill-opacity=".12" stroke="#7ee787" stroke-opacity=".4"/><text class="chip" x="211" y="206">Node</text>
<g class="ar"><text class="go" x="264" y="245" text-anchor="end">View →</text></g>
</svg>
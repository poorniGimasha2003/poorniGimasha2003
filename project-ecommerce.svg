<rect x="94" y="190" width="67" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".4"/><text class="chip" x="103" y="206">sklearn</text>
<rect x="169" y="190" width="81" height="24" rx="12" fill="#a78bfa" fill-opacity=".12" stroke="#a78bfa" stroke-opacity=".4"/><text class="chip" x="178" y="206">Streamlit</text>
<g class="ar"><text class="go" x="264" y="245" text-anchor="end">View →</text></g>

<text class="s" x="26" y="78" style="fill:#a78bfa;font-size:11px">DATA SCIENCE · ML</text>
<text class="p" x="26" y="106" style="font-size:13px">780K real transactions turned</text>
<text class="p" x="26" y="126" style="font-size:13px">into customer segments, churn</text>
<text class="p" x="26" y="146" style="font-size:13px">predictions and product insights</text>
<text class="p" x="26" y="166" style="font-size:13px">on an interactive dashboard.</text>

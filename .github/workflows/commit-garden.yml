name: Grow Commit Garden

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Grow the tree
        env:
          GH_USER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ secrets.GARDEN_TOKEN || github.token }}
          INCLUDE_PRIVATE: ${{ secrets.GARDEN_TOKEN != '' }}
          TZ_OFFSET_MIN: "330"
          EXTRA_REPOS: ""
          SKIP_REPOS: ""
        run: node garden/build.mjs

      - name: Commit the new garden
        run: |
          git config user.name  "commit-garden-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add commit-garden.svg
          git diff --cached --quiet || git commit -m "🌱 grow commit garden"
          git push

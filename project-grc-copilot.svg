.chip{font:500 11px Consolas,'Courier New',monospace;fill:#c9d1d9}
.e{font:26px 'Segoe UI',Helvetica,Arial,sans-serif}.go{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#f6c177}.ar{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/></linearGradient></defs>
<rect width="290" height="262" rx="14" fill="url(#bg)" stroke="#263046"/>
<rect x="0" y="0" width="6" height="262" rx="3" fill="#f6c177"/>

<text class="s" x="26" y="78" style="fill:#f6c177;font-size:11px">GENERATIVE AI · LLM · RAG</text>
<text class="p" x="26" y="106" style="font-size:13px">AI audit assistant that checks</text>
<text class="p" x="26" y="126" style="font-size:13px">expenses against company policies</text>

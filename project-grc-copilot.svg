<rect x="94" y="190" width="39" height="24" rx="12" fill="#f6c177" fill-opacity=".12" stroke="#f6c177" stroke-opacity=".4"/><text class="chip" x="103" y="206">LLM</text>
<rect x="141" y="190" width="39" height="24" rx="12" fill="#f6c177" fill-opacity=".12" stroke="#f6c177" stroke-opacity=".4"/><text class="chip" x="150" y="206">RAG</text>
<g class="ar"><text class="go" x="264" y="245" text-anchor="end">View →</text></g>

<svg xmlns="http://www.w3.org/2000/svg" width="290" height="262" viewBox="0 0 290 262"><style>
.h{font:700 22px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#e6edf3}
.p{font:400 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#9aa7b8}
.s{font:600 12px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff;letter-spacing:.5px}
.chip{font:500 11px Consolas,'Courier New',monospace;fill:#c9d1d9}
.e{font:26px 'Segoe UI',Helvetica,Arial,sans-serif}.go{font:600 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#7ee7ff}.ar{animation:nudge 1.6s ease-in-out infinite}@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(4px)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b33"/></linearGradient></defs>
<rect width="290" height="262" rx="14" fill="url(#bg)" stroke="#263046"/>
<rect x="0" y="0" width="6" height="262" rx="3" fill="#7ee7ff"/>
<text class="e" x="26" y="50">🧠</text><text class="h" x="64" y="47" style="font-size:19px">DNN Compression</text>
<text class="s" x="26" y="78" style="fill:#7ee7ff;font-size:11px">DEEP LEARNING · RESEARCH</text>
<text class="p" x="26" y="106" style="font-size:13px">Structured pruning of deep networks</text>
<text class="p" x="26" y="126" style="font-size:13px">(CNNs, RNNs, Transformers, GNNs)</text>
<text class="p" x="26" y="146" style="font-size:13px">to cut size and latency for fast</text>
<text class="p" x="26" y="166" style="font-size:13px">inference on edge hardware.</text>
<rect x="26" y="190" width="67" height="24" rx="12" fill="#7ee7ff" fill-opacity=".12" stroke="#7ee7ff" stroke-opacity=".4"/><text class="chip" x="35" y="206">PyTorch</text>
<rect x="101" y="190" width="102" height="24" rx="12" fill="#7ee7ff" fill-opacity=".12" stroke="#7ee7ff" stroke-opacity=".4"/><text class="chip" x="110" y="206">Transformers</text>
<rect x="211" y="190" width="39" height="24" rx="12" fill="#7ee7ff" fill-opacity=".12" stroke="#7ee7ff" stroke-opacity=".4"/><text class="chip" x="220" y="206">PyG</text>
<g class="ar"><text class="go" x="264" y="245" text-anchor="end">View →</text></g>
</svg>